[project]
name = "drug-perturbation-geometry"
version = "0.1.0"
description = "Bracket norm predicts drug mechanism transport across cell lines (LINCS L1000)"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Elliot Tower", email = "elliot@elliottower.ai"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
data = [
    "cmapPy>=4.0",
]

[tool.setuptools.packages.find]
include = ["geometry*", "data*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
